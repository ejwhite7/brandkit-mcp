name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without leading v). Used only when triggered manually.'
        required: true
        type: string

jobs:
  publish:
    name: npm + MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for the MCP Registry (and npm provenance)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Resolve target version
        id: ver
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/resolve-publish-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Sync version into package.json and server.json
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['package.json', 'server.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = process.env.RELEASE_VERSION;
              if (Array.isArray(j.packages)) {
                for (const p of j.packages) if (p.identifier === 'brandkit-mcp') p.version = process.env.RELEASE_VERSION;
              }
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
          "

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      - name: Summary
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          printf '## Published `brandkit-mcp@%s`\n\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- npm: https://www.npmjs.com/package/brandkit-mcp/v/$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- MCP Registry: https://registry.modelcontextprotocol.io/v0/servers?search=brandkit-mcp" >> "$GITHUB_STEP_SUMMARY"
