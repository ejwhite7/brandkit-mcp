name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without leading v). Used only when triggered manually.'
        required: true
        type: string

jobs:
  publish:
    name: npm + MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for the MCP Registry (and npm provenance)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Resolve target version
        id: ver
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: node scripts/resolve-publish-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Sync version into package.json and server.json
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            for (const f of ['package.json', 'server.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = process.env.RELEASE_VERSION;
              if (Array.isArray(j.packages)) {
                for (const p of j.packages) if (p.identifier === 'brandkit-mcp') p.version = process.env.RELEASE_VERSION;
              }
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
          "

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: '1.7.9'
          MCP_PUBLISHER_LINUX_AMD64_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
          MCP_PUBLISHER_LINUX_ARM64_SHA256: 04f5199b3deef8e6fc4d6ed98c56a74f799def53edca3fe6d4862ecd4397c172
        run: |
          case "$(uname -s):$(uname -m)" in
            Linux:x86_64)
              asset="mcp-publisher_linux_amd64.tar.gz"
              checksum="$MCP_PUBLISHER_LINUX_AMD64_SHA256"
              ;;
            Linux:aarch64)
              asset="mcp-publisher_linux_arm64.tar.gz"
              checksum="$MCP_PUBLISHER_LINUX_ARM64_SHA256"
              ;;
            *)
              printf 'Unsupported mcp-publisher platform: %s:%s\n' "$(uname -s)" "$(uname -m)" >&2
              exit 1
              ;;
          esac

          archive="$(mktemp "${RUNNER_TEMP:?}/mcp-publisher.XXXXXX.tar.gz")"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/$asset"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --no-same-owner mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      - name: Summary
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          printf '## Published `brandkit-mcp@%s`\n\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- npm: https://www.npmjs.com/package/brandkit-mcp/v/$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- MCP Registry: https://registry.modelcontextprotocol.io/v0/servers?search=brandkit-mcp" >> "$GITHUB_STEP_SUMMARY"
