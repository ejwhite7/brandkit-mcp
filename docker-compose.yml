services:
  brandkit-mcp:
    build: .
    init: true
    ports:
      - "127.0.0.1:${BRANDKIT_PORT:-3001}:3001"
    environment:
      BRANDKIT_AUTH_TOKEN: ${BRANDKIT_AUTH_TOKEN:?Set BRANDKIT_AUTH_TOKEN before starting Compose}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health',{headers:{Authorization:'Bearer '+process.env.BRANDKIT_AUTH_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
